plugins {
	id 'java'
}

repositories {
	//mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.example.ExamplePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.example'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// ZombieLite (../ZombieLite, the user's overlay-only boss-helper plugin bundle, `no-packets`
// branch) rides along in the SAME client when its checkout is present: `run` builds its jar in
// place and puts it on the classpath, and ExamplePluginTest loads its CustomPlugins.CLASSLIST by
// reflection ahead of ControllerPlugin. Nothing here is a compile-time dependency, so a machine
// without the checkout gets the bridge alone, exactly as before. Added 2026-09-05 so a Hunllef
// kill can be played by hand with ZombieLite's counters up while /recorder captures it.
//
// `../ZombieLite` is relative to the MAIN checkout. A git WORKTREE lives at
// <repo>/.claude/worktrees/<name>, so there the same expression names a sibling of the worktree
// that does not exist -- `zombieLitePresent` is simply false, nothing fails, and the client comes
// up with the bridge alone and no overlays. FOUND 2026-09-21 rebuilding the slayer client out of
// the crossfloor-travel worktree; the symptom is an absence, which is why it is worth a log line
// rather than only a comment.
//
// In a worktree `.git` is a FILE reading `gitdir: <repo>/.git/worktrees/<name>`, so the main
// checkout's root is three parents up from that gitdir and ZombieLite is ITS sibling.
def zombieLiteDir = {
	def sibling = file('../ZombieLite')
	if (sibling.isDirectory()) {
		return sibling
	}
	def dotGit = file('.git')
	if (dotGit.isFile()) {
		def match = (dotGit.text =~ /(?m)^\s*gitdir:\s*(.+?)\s*$/)
		if (match) {
			def gitDir = new File(match[0][1])
			if (!gitDir.isAbsolute()) {
				gitDir = new File(rootDir, match[0][1])
			}
			// <repo>/.git/worktrees/<name> -> <repo>, whose sibling is the checkout we want.
			def mainRoot = gitDir.parentFile?.parentFile?.parentFile
			if (mainRoot != null && mainRoot.parentFile != null) {
				def viaMainCheckout = new File(mainRoot.parentFile, 'ZombieLite')
				if (viaMainCheckout.isDirectory()) {
					return viaMainCheckout
				}
			}
		}
	}
	return sibling
}()
def zombieLitePresent = zombieLiteDir.isDirectory()
if (zombieLitePresent) {
	logger.lifecycle("ZombieLite: ${zombieLiteDir} -- its plugins will be loaded next to the bridge")
} else {
	logger.lifecycle("ZombieLite: no checkout found (looked for ${file('../ZombieLite')}) -- "
			+ "the client will come up with the bridge alone, no overlays")
}

configurations {
	zombieLite
}

dependencies {
	if (zombieLitePresent) {
		zombieLite files(
			"${zombieLiteDir}/build/libs/example-1.0-SNAPSHOT.jar",
			"${zombieLiteDir}/config-processor/build/libs/config-processor.jar",
			"${zombieLiteDir}/lib/jaco-mp3-player-0.9.5.jar"
		)
		// ZombieLite's only Maven runtime dependency beyond the RuneLite client itself. Its lwjgl
		// deps are NOT needed: HdPlugin is not in CustomPlugins.CLASSLIST and never loads.
		zombieLite('com.google.inject.extensions:guice-multibindings:4.1.0') {
			exclude group: 'com.google.inject'
		}
	}
}

tasks.register('buildZombieLite', GradleBuild) {
	description = "Builds ../ZombieLite plugin jar so run can load it next to the bridge"
	onlyIf { zombieLitePresent }
	dir = zombieLiteDir
	tasks = ['jar', ':config-processor:jar']
}

tasks.register('checkZombieLite', JavaExec) {
	description = "Links every ZombieLite plugin class against this build's RuneLite without launching a client"
	onlyIf { zombieLitePresent }
	dependsOn 'buildZombieLite'
	classpath = sourceSets.test.runtimeClasspath + configurations.zombieLite
	mainClass = 'com.example.ZombieLiteClasspathCheck'
}

tasks.register('run', JavaExec) {
	if (zombieLitePresent) {
		dependsOn 'buildZombieLite'
	}
	classpath = sourceSets.test.runtimeClasspath + configurations.zombieLite
	mainClass = pluginMainClass

	jvmArgs "-ea"
	// Machine-specific client JVM args, read from ~/.gradle/gradle.properties so they never
	// enter the repo. The OSRS VM sets `clientJvmArgs=-XX:ActiveProcessorCount=32
	// -Xmx8541700096` so the guest's login fingerprint (CPU count, max heap -- see CLAUDE.md
	// "What the game client sends home") matches what this host has always reported.
	if (project.hasProperty('clientJvmArgs')) {
		jvmArgs project.property('clientJvmArgs').toString().trim().split(/\s+/)
	}
	args "--developer-mode", "--debug", "--disable-telemetry"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
